[workspace]
members = ["crates/aegis-core", "crates/aegis-py"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["Cedric Brzyski"]

[workspace.dependencies]
aegis-core = { path = "crates/aegis-core" }
rayon = "1.10"
rand = "0.8"
rand_xoshiro = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "thin"
