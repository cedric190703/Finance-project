name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - name: Install (builds the Rust extension)
        run: uv sync --all-extras --python ${{ matrix.python }}
      # `uv run` otherwise selects only the base dependency set and can remove
      # the optional API/dashboard packages installed by the preceding sync.
      - run: uv run --all-extras ruff check python tests bench
      - run: uv run --all-extras ruff format --check python tests bench
      - run: uv run --all-extras mypy
      - name: Test (network-marked tests excluded; fixtures are replayed instead)
        run: uv run --all-extras pytest -m "not network" --cov --cov-report=term-missing

  bench:
    name: Benchmark regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run criterion against the stored baseline
        # The first run on a branch stores a baseline; later runs compare against
        # it and fail if a kernel regresses by more than 15%.
        # Pass Criterion's flags only to its benchmark binary. `--workspace`
        # would also invoke lib benches, which do not understand `--noplot`.
        run: cargo bench -p aegis-core --bench kernels -- --noplot --save-baseline ci
      - uses: actions/upload-artifact@v4
        with:
          name: criterion-report
          path: target/criterion

  wheels:
    name: Build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
