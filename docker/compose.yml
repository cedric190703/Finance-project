services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      AEGIS_DB: /app/data/warehouse/market.duckdb
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["streamlit", "run", "python/aegis/dashboard/app.py", "--server.address", "0.0.0.0"]
    environment:
      AEGIS_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
